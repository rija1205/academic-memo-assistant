name: Stage 8 assisted writing checks

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run lint:web
      - run: npm run test:web
      - run: npm run build:web

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: academic_memo_test
          POSTGRES_USER: academic_memo
          POSTGRES_PASSWORD: academic_memo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academic_memo -d academic_memo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://academic_memo:academic_memo_dev@localhost:5432/academic_memo_test
      TEST_DATABASE_URL: postgresql+asyncpg://academic_memo:academic_memo_dev@localhost:5432/academic_memo_test
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m "not integration"
      - run: python -m pytest -m integration
      - run: python -m ruff check .

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: >-
          python -c "from app.worker.celery_app import celery_app;
          assert 'system.ping' in celery_app.tasks;
          assert 'sources.process_source' in celery_app.tasks;
          assert 'rag.index_source' in celery_app.tasks;
          assert 'rag.deindex_source' in celery_app.tasks"
