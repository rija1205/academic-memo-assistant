[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-memo-assistant-api"
version = "0.1.0"
description = "FastAPI foundation for Academic Memo Assistant"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.29,<1",
  "celery>=5.4,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "google-auth>=2.35,<3",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5.0,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1,<4",
  "pgvector>=0.3,<1",
  "boto3>=1.35,<2",
  "redis>=5.2,<6",
  "requests>=2.32,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests requiring a dedicated PostgreSQL test database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
