[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-memo-assistant-worker"
version = "0.1.0"
description = "Celery worker for Academic Memo Assistant source processing"
requires-python = ">=3.12"
dependencies = [
  "celery>=5.4,<6",
  "httpx>=0.28,<1",
  "redis>=5.2,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
